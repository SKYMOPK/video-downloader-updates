[project]
name = "video-downloader"
version = "0.3.2"
description = "Traditional Chinese Windows video downloader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "Pillow>=12,<14",
    "pypdfium2>=5,<6",
    "python-docx>=1.2,<2",
    "olefile>=0.47,<1",
    "psutil>=7,<9",
]

[dependency-groups]
dev = ["pyinstaller>=6.16,<7", "pytest>=8,<10", "Pillow>=12,<14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
